services:
  - type: web
    name: MyAutomationWebApp
    env: docker
    rootDir: .
    plan: free
    envVars:
      - key: DatabaseProvider
        value: PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: autotechhub-db
          property: connectionString

databases:
  - name: autotechhub-db
    databaseName: autotechhub
    user: autotechhub_user
    plan: free
