version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: autotechhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autotechhub
      POSTGRES_USER: autotechhub_user
      POSTGRES_PASSWORD: AutoTechPgStrongPassword2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotechhub_user -d autotechhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autotechhub_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: PostgreSQL
      ConnectionStrings__PostgreSqlConnection: "Host=db;Port=5432;Database=autotechhub;Username=autotechhub_user;Password=AutoTechPgStrongPassword2026;Pooling=true;Maximum Pool Size=100;SSL Mode=Disable"
    volumes:
      - uploads_data:/app/wwwroot/uploads

volumes:
  pgdata:
  uploads_data:
